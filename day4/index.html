
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your thoughts, one note at a time.</p>
  </header>

  <main>
    <section class="note-card">
      <label for="note-text">Write your note</label>
      <textarea
        id="note-text"
        rows="8"
        maxlength="200"
        placeholder="Start typing here..."
      ></textarea>

      <p id="char-count" aria-live="polite">0 / 200 characters</p>
      <p id="word-count" aria-live="polite">0 words</p>

      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </section>
  </main>

  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>
</body>
</html>
